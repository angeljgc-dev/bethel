<!-- El icono de la pestana. La celosia de la portada, en la paleta clara: muro de cal, block
     de tinta, y la luz de las diez entrando por los dos huecos y cayendo al
     suelo. Sin degradados ni trazos finos: a 16 px lo unico que se lee son las
     dos manchas de luz sobre el bloque oscuro. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f3ede3"/>
  <path fill="#f2c15e" d="M18 40h12l10 18H24zm18 0h12l10 18H42z"/>
  <rect x="8" y="8" width="48" height="32" fill="#1c221f"/>
  <path fill="#f2c15e" d="M18 16h12v16H18zm18 0h12v16H36z"/>
</svg>
