name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El candado de publicacion detiene el build mientras los datos sigan
      # siendo de muestra. Aqui se levanta a proposito: esta version esta en
      # linea para que la iglesia la revise y corrija, no para atender gente.
      # La banda de aviso y el noindex NO dependen de esta variable, sino de
      # CONFIRMADO_POR_LA_IGLESIA, asi que siguen puestos.
      - run: npm run build
        env:
          BETHEL_PERMITIR_INVENTADOS: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
